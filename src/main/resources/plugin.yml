name: Magnatas
version: '2.2.3'
main: br.com.magnatasoriginal.magnatas.Magnatas
api-version: '1.21'
authors: [ GnomoMuitoLouco ]
description: Magnatas Original
website: https://www.servidormagnatas.com.br
depend: [PlaceholderAPI]
softdepend: [Vault]

commands:
  # 📢 Sistema de Mensagens
  magnatas:
    description: Comando principal do plugin Magnatas
    usage: /magnatas [info|ajuda|reload]

  # Comandos de Limites
  limite:
    description: Define limite de blocos por chunk
    usage: /limite <add|remover|scan|scanall> [quantidade|raio]
    permission: magnatas.limites
    permission-message: Você não tem permissão para usar este comando.

  limites:
    description: Lista os blocos limitados por chunk
    usage: /limites [página]
    default: true

  # 🏠 Sistema de Homes
  sethome:
    description: Define uma home
  home:
    description: Teleporta para uma home
  homes:
    description: Lista suas homes
  delhome:
    description: Remove uma home

  # 🧭 Sistema de Warps
  setwarp:
    description: Define uma warp pública
    usage: /setwarp <nome>
    permission: magnatas.admin.setwarp
    default: op

  delwarp:
    description: Remove uma warp pública
    usage: /delwarp <nome>
    permission: magnatas.admin.delwarp
    default: op

  warp:
    description: Teleporta para uma warp pública
    usage: /warp <nome>
    permission: magnatas.warp
    default: true

  warps:
    description: Lista todas as warps públicas
    usage: /warps [página]
    default: true

  # 🏪 Sistema de Lojas
  lojas:
    description: Mostra todas as lojas dos jogadores
  setloja:
    description: Marca a loja do jogador
  delloja:
    description: Deleta a loja do jogador
  tploja:
    description: Teleporta para a loja de um jogador

  # 💰 Sistema de Tokens - Jogador
  token:
    description: Comando principal de Tokens
    usage: /token <receber|info|loja|top>
    permission: magnatas.token
    default: true

  # 💰 Sistema de Tokens - Admin
  addtoken:
    description: Adiciona Tokens a um jogador
    usage: /addtoken <nick> <quantidade>
    permission: magnatas.admin.token.add
    default: op

  removetoken:
    description: Remove Tokens de um jogador
    usage: /removetoken <nick> <quantidade>
    permission: magnatas.admin.token.remove
    default: op

  settoken:
    description: Define a quantidade exata de Tokens de um jogador
    usage: /settoken <nick> <quantidade>
    permission: magnatas.admin.token.set
    default: op

  vertoken:
    description: Ver os Tokens de outro jogador
    usage: /vertoken <nick>
    permission: magnatas.admin.token.ver
    default: op

permissions:
  # Permissões de Limites
  magnatas.limites:
    description: Permissão para usar comandos de limite de blocos
    default: op

  magnatas.admin.limites.bypass:
    description: Permissão para ignorar limites de blocos por chunk
    default: op

  magnatas.admin.limites.alerta:
    description: Permissão para receber alertas de escaneamento de blocos acima do limite
    default: op

  magnatas.admin.limites.progresso:
    description: Permissão para visualizar o progresso da varredura distribuída
    default: op

  # Permissões de Homes
  magnatas.homes.1:
    description: Permissão para ter 1 home
    default: true

  magnatas.homes.*:
    description: Permissão para ter homes infinitas
    default: op

  # 🧭 Permissões de Warps
  magnatas.admin.setwarp:
    description: Permissão para definir warps públicas
    default: op

  magnatas.admin.delwarp:
    description: Permissão para remover warps públicas
    default: op

  magnatas.warp:
    description: Permissão para visualizar e teleportar para warps
    default: true

  # 🏪 Permissões de Lojas
  magnatas.setloja:
    description: Permissão para definir uma loja
    default: true

  magnatas.delloja.others:
    description: Permissão para deletar a loja de outros jogadores
    default: op

  magnatas.admin:
    description: Permissão para administrar lojas
    default: op

  # 🧭 Permissões especiais
  magnatas.bypasscooldown:
    description: Permissão para ignorar a espera de 5 segundos para teleportar
    default: op

  # 💰 Permissões de Tokens - Jogador
  magnatas.token:
    description: Permissão para usar comandos de Tokens
    default: true

  # 💰 Permissões de Tokens - Admin e VIP
  magnatas.vip.token:
    description: Permissão para receber 2 Tokens diários
    default: op

  magnatas.admin.token.add:
    description: Permissão para adicionar Tokens
    default: op

  magnatas.admin.token.remove:
    description: Permissão para remover Tokens
    default: op

  magnatas.admin.token.set:
    description: Permissão para definir Tokens
    default: op

  magnatas.admin.token.ver:
    description: Permissão para ver Tokens de outros jogadores
    default: op

  # 🏷️ Permissões de Títulos
  magnatas.titulos:
    description: Permissão para abrir o menu de títulos
    default: true

  magnatas.titulos.admin:
    description: Permissão para administrar títulos
    default: op

  # 📢 Permissões de Mensagens - Ajudante
  magnatas.staff.ajuda:
    description: Permissão para receber mensagens automáticas de ajuda
    default: op

  magnatas.reload:
    description: Permissão para recarregar o plugin
    default: op